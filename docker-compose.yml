networks:
  hadoop:
    driver: bridge

services:

  hadoop-master:
    image: liliasfaxi/hadoop-cluster:latest
    container_name: hadoop-master
    hostname: hadoop-master
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "8088:8088"   # YARN Resource Manager
      - "7077:7077"   # Spark Master RPC
      - "8080:8080"   # Spark Master Web UI
    volumes:
      - ./data/sample:/home/hadoop/data
    networks:
      - hadoop

  hadoop-worker1:
    image: liliasfaxi/hadoop-cluster:latest
    container_name: hadoop-worker1
    hostname: hadoop-worker1
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8040:8042"
    networks:
      - hadoop
    depends_on:
      - hadoop-master

  hadoop-worker2:
    image: liliasfaxi/hadoop-cluster:latest
    container_name: hadoop-worker2
    hostname: hadoop-worker2
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8041:8042"
    networks:
      - hadoop
    depends_on:
      - hadoop-master
