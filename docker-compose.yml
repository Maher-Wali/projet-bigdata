services:

    namenode:
      image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
      container_name: namenode
      hostname: namenode
      ports:
        - "9870:9870"
        - "9000:9000"
      environment:
        CLUSTER_NAME: "taxi-cluster"
      env_file:
        - ./hadoop.env
      volumes:
        - namenode_data:/hadoop/dfs/name
        - ./data:/data
      networks:
        - bigdata-net

    datanode:
      image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
      container_name: datanode
      hostname: datanode
      environment:
        SERVICE_PRECONDITION: "namenode:9870"
      env_file:
        - ./hadoop.env
      volumes:
        - datanode_data:/hadoop/dfs/data
      depends_on:
        - namenode
      networks:
        - bigdata-net

    zookeeper:
      image: confluentinc/cp-zookeeper:7.5.0
      container_name: zookeeper
      hostname: zookeeper
      ports:
        - "2181:2181"
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      networks:
        - bigdata-net

    kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: kafka
      hostname: kafka
      ports:
        - "9092:9092"
        - "29092:29092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      depends_on:
        - zookeeper
      networks:
        - bigdata-net

    spark-master:
      image: jupyter/pyspark-notebook:spark-3.5.0
      container_name: spark-master
      hostname: spark-master
      user: root
      ports:
        - "8080:8080"
        - "7077:7077"
      command: bash -c "/usr/local/spark/sbin/start-master.sh --host spark-master --port 7077 --webui-port 8080 && tail -f /usr/local/spark/logs/*"
      environment:
        SPARK_HOME: /usr/local/spark
        SPARK_NO_DAEMONIZE: "false"
        HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      volumes:
        - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
        - ./jars:/opt/spark-kafka-jars:ro
      networks:
        - bigdata-net

    spark-worker-1:
      image: jupyter/pyspark-notebook:spark-3.5.0
      container_name: spark-worker-1
      user: root
      command: bash -c "/usr/local/spark/sbin/start-worker.sh spark://spark-master:7077 --memory 2g --cores 3 && tail -f /usr/local/spark/logs/*"
      environment:
        SPARK_HOME: /usr/local/spark
        SPARK_NO_DAEMONIZE: "false"
        HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      volumes:
        - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
        - ./data:/home/jovyan/data
        - ./jars:/opt/spark-kafka-jars:ro
      depends_on:
        - spark-master
      networks:
        - bigdata-net

    spark-worker-2:
      image: jupyter/pyspark-notebook:spark-3.5.0
      container_name: spark-worker-2
      user: root
      command: bash -c "/usr/local/spark/sbin/start-worker.sh spark://spark-master:7077 --memory 2g --cores 3 && tail -f /usr/local/spark/logs/*"
      environment:
        SPARK_HOME: /usr/local/spark
        SPARK_NO_DAEMONIZE: "false"
        HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      volumes:
        - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
        - ./data:/home/jovyan/data
        - ./jars:/opt/spark-kafka-jars:ro
      depends_on:
        - spark-master
      networks:
        - bigdata-net

    jupyter:
      image: jupyter/pyspark-notebook:spark-3.5.0
      container_name: jupyter
      ports:
        - "8888:8888"
      volumes:
        - ./notebooks:/home/jovyan/work
        - ./data:/home/jovyan/data
        - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
        - ./jars:/opt/spark-kafka-jars:ro
      environment:
        SPARK_MASTER: spark://spark-master:7077
        HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      networks:
        - bigdata-net

    clickhouse:
      image: clickhouse/clickhouse-server:23.8
      container_name: clickhouse
      hostname: clickhouse
      ports:
        - "8123:8123"
        - "9001:9000"
      volumes:
        - clickhouse_data:/var/lib/clickhouse
        - ./init_clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      networks:
        - bigdata-net

    grafana:
      image: grafana/grafana:10.4.0
      container_name: grafana
      hostname: grafana
      ports:
        - "3000:3000"
      environment:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
        GF_SECURITY_ALLOW_EMBEDDING: "true"
        GF_SECURITY_CONTENT_SECURITY_POLICY: "false"
        GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      volumes:
        - grafana_data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning
        - ./grafana/dashboards:/var/lib/grafana/dashboards
      depends_on:
        - clickhouse
      networks:
        - bigdata-net

    dashboard:
      image: python:3.11-slim
      container_name: dashboard
      hostname: dashboard
      ports:
        - "8501:8501"
      volumes:
        - ./dashboard:/app
      working_dir: /app
      command: >
        bash -c "pip install streamlit plotly clickhouse-connect pandas &&
                 streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true"
      depends_on:
        - clickhouse
      networks:
        - bigdata-net

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  clickhouse_data:
  grafana_data:

networks:
  bigdata-net:
    driver: bridge
